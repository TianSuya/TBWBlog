# Umami analytics.
#
# Umami v3 dropped MySQL support — PostgreSQL is the only supported database.
# Together these two containers idle at roughly 300MB, which is comfortable on
# a 2GB box alongside Caddy.
#
# Copy deploy/umami.env.example to .env in this directory and fill it in first.

services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: always
    # Bound to loopback on purpose: Caddy terminates TLS at stats.example.com
    # and proxies here. Publishing 0.0.0.0:3000 would expose the dashboard over
    # plain HTTP straight past the reverse proxy.
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${APP_SECRET}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/api/heartbeat || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - umami-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umami -d umami']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  umami-db:
